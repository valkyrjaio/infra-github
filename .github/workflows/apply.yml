name: Apply

on:
  push:
    branches:
      - 26.x
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Applies serialize through this group, and each run pulls after acquiring its
# slot, so a queued apply starts from the state its predecessor committed.
concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  apply:
    name: Config Apply
    # The Völundr bot's only push here is this workflow's own state commit, and
    # re-applying it would loop.
    if: ${{ github.event_name != 'push' || github.actor != 'valkyrja-volundr[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          private-key: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.generate-token.outputs.token }}

      - name: Pull the latest state
        run: git pull --ff-only

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: '1.12.5'

      - name: Initialize
        run: tofu init -input=false

      - name: Apply
        shell: bash
        env:
          GITHUB_APP_ID: ${{ secrets.VALKYRJA_GHA_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.VALKYRJA_GHA_INSTALLATION_ID }}
          GITHUB_APP_PEM_FILE: ${{ secrets.VALKYRJA_GHA_PRIVATE_KEY }}
        run: tofu apply -input=false -auto-approve -no-color 2>&1 | tee apply.txt

      - name: Commit the state
        run: |
          if git diff --quiet -- state/; then
            echo 'The state did not change.'
            exit 0
          fi
          git config user.name 'valkyrja-volundr[bot]'
          git config user.email 'valkyrja-volundr[bot]@users.noreply.github.com'
          git add state/
          git commit -m '[State] chore: Record the applied state'
          # A merge that lands mid-apply rejects the push as non-fast-forward.
          # Only this workflow writes state/, so the rebase cannot conflict.
          git pull --rebase
          git push
